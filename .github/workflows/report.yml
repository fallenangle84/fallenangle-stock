name: 持仓播报推送

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30)
    - cron: '30 1 * * 1-5'
    # 北京时间 10:00,10:30 (UTC 2:00,2:30)
    - cron: '0,30 2 * * 1-5'
    # 北京时间 11:00,11:30 (UTC 3:00,3:30)
    - cron: '0,30 3 * * 1-5'
    # 北京时间 13:00,13:30,14:00,14:30 (UTC 5:00-6:30)
    - cron: '0,30 5,6 * * 1-5'
    # 北京时间 15:00 (UTC 7:00)
    - cron: '0 7 * * 1-5'
  # 允许手动触发（调试用）
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: 安装Python依赖
        run: |
          python -m pip install --quiet Pillow

      - name: 执行持仓播报
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python stock_report.py
