name: Stock Report

on:
  schedule:
    # Beijing 09:30 (UTC 01:30)
    - cron: '30 1 * * 1-5'
    # Beijing 10:00, 10:30 (UTC 02:00, 02:30)
    - cron: '0,30 2 * * 1-5'
    # Beijing 11:00, 11:30 (UTC 03:00, 03:30)
    - cron: '0,30 3 * * 1-5'
    # Beijing 13:00, 13:30 (UTC 05:00, 05:30)
    - cron: '0,30 5 * * 1-5'
    # Beijing 14:00, 14:30 (UTC 06:00, 06:30)
    - cron: '0,30 6 * * 1-5'
    # Beijing 15:00 (UTC 07:00)
    - cron: '0 7 * * 1-5'
    # Beijing 15:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: Install Python Dependencies
        run: |
          python -m pip install --quiet Pillow

      - name: Run Stock Report
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python stock_report.py
